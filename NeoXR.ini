[Wheel]
; Opt-in only. Set 1 after input configuration and build verification.
Enabled=0
Process=iRacingSim64DX11.exe
; custom loads the supplied wheel. placeholder restores the original hardcoded wheel.
Model=custom
; Native source model, relative to this INI or an absolute path. Reloaded with its dependencies on save.
ModelFile=assets/neo-x.gltf
Brightness=0.8
ButtonTravelMm=1.2
; Approximate hinge rotation. Set 0 to disable all paddle movement.
PaddleAngleDegrees=7
; Zero-based DirectInput button indices on ButtonDevice; -1 disables movement.
LeftPaddleButton=-1
RightPaddleButton=-1
LeftClutchButton=-1
RightClutchButton=-1
; Analog clutch levers: axis index (0=X .. 7=Slider1 as below) on ButtonDevice, overrides the button.
; Rest/Full are the raw NeoXR-Input readings released and fully pulled.
LeftClutchAxis=-1
LeftClutchRest=-10000
LeftClutchFull=10000
RightClutchAxis=-1
RightClutchRest=-10000
RightClutchFull=10000
ClutchAngleDegrees=12
; Run NeoXR-Input.exe. Device order can change after reconnecting hardware.
SteeringDevice=-1
; -1 uses the steering device's buttons. Otherwise use the NEO X device index.
ButtonDevice=-1
; 0=X 1=Y 2=Z 3=Rx 4=Ry 5=Rz 6=Slider0 7=Slider1
SteeringAxis=0
; Must match the physical device's FULL lock-to-lock configured angle.
RotationDegrees=900
Invert=0
; Subtracted after inversion. A reading of +3 degrees with offset +3 displays zero.
SteeringZeroOffsetDegrees=0
; The model's overall width; it is scaled evenly to it. The supplied model is shaped to a measured Simagic
; NEO X, so 316 is its true size.
WidthMm=316
; Initial position relative to the headset at startup / F8 calibration, metres.
; Look straight ahead when calibrating. Negative Z is forward, negative Y down.
; In VR, Ctrl+Shift+Down/Up moves the wheel 1 cm closer/farther and saves Z here.
; Ctrl+Shift+PageUp/PageDown tilts the top 1 degree toward/away and saves TiltDegrees.
X=0
Y=-0.30
Z=-0.50
TiltDegrees=0
; F8 recenters and saves the head position/heading here, so the wheel returns to the same
; place next session. Delete the line to go back to placing the wheel at startup.
Calibration=
; Also recenter from the same key or wheel button you bind to iRacing's VR recenter,
; e.g. RecenterKey=F12 (F1-F24, a letter/digit, or a virtual-key number) or RecenterButton=30.
RecenterKey=
RecenterButton=-1
; Mouse placement. EditKey enters edit mode (wheel turns blue) while the game has focus:
;  left-drag = move left/right/up/down, right-drag or scroll = closer/farther,
;  M = size/rotate mode (orange): left-drag = size, right-drag = pitch (up/down) or yaw (left/right), locked to the first direction until released,
;  Esc (wheel turns green) then Enter saves X/Y/Z/TiltDegrees/YawDegrees/WidthMm, or Esc again to cancel.
;  A (while editing) measures the in-game wheel from iRacing's depth and moves onto it; hide the hands first.
;  H (while editing) switches between the game and the room seen through the headset cameras; see Passthrough below.
;  In an iRacing car, Enter saves an alignment for that car under [Cars] instead, and Delete forgets it.
;  Pressing Esc five times quickly releases the mouse and keyboard for the rest of the session.
;  EditOpacity makes the wheel see-through while editing, to line it up with the in-game wheel (0.1-1).
EditKey=Tab
EditSensitivity=1
EditOpacity=0.5
YawDegrees=0
; Zero-based DirectInput indices. The model button order is documented in README.
Button0=0
Button1=1
Button2=2
Button3=3
Button4=4
Button5=5
Button6=6
Button7=7
; Rotary knobs: the button each detent direction sends. Swap CW/CCW if a knob turns backwards.
B9B10KnobCW=8
B9B10KnobCCW=9
B11B12KnobCW=10
B11B12KnobCCW=11
B37B38KnobCW=36
B37B38KnobCCW=37
B39B40KnobCW=38
B39B40KnobCCW=39
KnobStepDegrees=15
; Joysticks: button per direction, or set ...POV to a hat index 0-3 shown by NeoXR-Input.
LeftStickUp=-1
LeftStickDown=-1
LeftStickLeft=-1
LeftStickRight=-1
LeftStickPush=-1
LeftStickPOV=-1
RightStickUp=-1
RightStickDown=-1
RightStickLeft=-1
RightStickRight=-1
RightStickPush=-1
RightStickPOV=-1
StickAngleDegrees=12
; Click feedback. ClickVolume=0 mutes; FlashStrength=0 disables the highlight flash.
; ClickSoundFile optionally replaces the built-in clicks with a WAV (relative to this folder).
ClickVolume=0.5
ClickSoundFile=
FlashStrength=0.75
; H in edit mode shows the room through the headset cameras, to line the wheel up with the real one.
; Needs Passthrough over Meta Quest Link in the Meta Horizon Link app. 0 never asks the runtime for it.
Passthrough=1
